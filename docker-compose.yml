version: '3.8'

services:
  luxtts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxtts-gradio
    ports:
      - "17860:7860"  # Web UI 端口
      - "8000:8000"   # API 端口
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 可选：独立的 API 服务
  luxtts-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxtts-api
    ports:
      - "8001:8000"
    volumes:
      - ./models:/app/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: python luxtts_api_server.py --host 0.0.0.0 --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      - luxtts

networks:
  default:
    name: luxtts-network
